[package]
name = "devbar"
version = "0.1.0"
description = "Menu-bar dev environment health monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
walkdir = "2"
shellexpand = "3"

[[bin]]
name = "devbar"
path = "src/main.rs"
