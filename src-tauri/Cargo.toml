[package]
name = "devbar"
version = "0.1.0"
description = "Menu-bar dev environment health monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
walkdir = "2"
shellexpand = "3"
dirs = "6"
wait-timeout = "0.2"
toml = "0.8"


[[bin]]
name = "devbar"
path = "src/main.rs"
