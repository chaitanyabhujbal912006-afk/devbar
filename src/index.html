<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DevBar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <span class="title">DevBar</span>
      <div class="header-actions">
        <button id="settings-btn" title="Settings">⚙</button>
        <button id="refresh-btn" title="Refresh now">⟳</button>
      </div>
    </header>

    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-section">
        <div class="settings-header">
          <h2>Watched Folders</h2>
        </div>
        <div id="watch-dirs-list" class="list"></div>
        <form id="add-dir-form" class="add-dir-form">
          <input type="text" id="dir-input" placeholder="e.g. ~/projects or C:\code" required />
          <button type="submit" id="add-dir-btn">Add</button>
        </form>
      </div>

      <div class="settings-section" style="margin-top: 12px; padding-top: 10px; border-top: 1px solid #3f3f46;">
        <div class="setting-toggle-row">
          <label for="autostart-toggle">Launch at login</label>
          <input type="checkbox" id="autostart-toggle" />
        </div>
      </div>
    </div>

    <div id="monitors-view">
      <section class="block">
        <h2>Disk Space</h2>
        <div id="disk-list" class="list"></div>
      </section>

      <section class="block">
        <h2>Git Repos</h2>
        <div id="repo-list" class="list"></div>
      </section>

      <section class="block">
        <h2>Containers</h2>
        <div id="container-list" class="list"></div>
      </section>
    </div>

    <footer>
      <span id="last-updated">Loading…</span>
    </footer>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
